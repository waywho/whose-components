name: PR to Release

on:
  pull_request:
    types: [opened, reopened, labeled, unlabeled, synchronize, closed]
    branches: [main]

jobs:
  check-labels:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check the release labels
        uses: waywho/pr-to-release@v1

  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pr-to-release
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The main ruleset lets only this deploy key push the release commit and tag.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.9
          bundler-cache: true
      - name: Update the changelog and release
        uses: waywho/pr-to-release@v1
        with:
          version-command: bundle config set --local deployment false && bundle exec bump $RELEASE_LEVEL --no-commit
